<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.I Replicator 2.0</title>
<link rel="stylesheet" href="CSS_for_Film.css">
</head>

<body>

    //setting up the html for that chatbot
    <div class="chat-header">
        A.I REPLICATOR 2.0
    </div>

    <div class="settings-panel">
        <h3>Replication Settings</h3>

        <label>Subject Name</label>
        <input type="text" value="Joshua" disabled>

        <label>Relationship</label>
        <input type="text" value="Brother" disabled>

        <label>Personality Sync</label>
        <input type="range" value="92" disabled>

        <label>Ethical Safeguards</label>
        <input type="checkbox" checked disabled>
    </div>

    <div id="chat-box"></div>

    <!-- letting the user enter their reponse to the "ai" -->
    <div class="input-area">
        <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off">
    </div>

</div>
</div>
</div>
<!-- attaching the java file -->
<script src="Java-Courtneys_Film.js"></script>
</body>
</html>
